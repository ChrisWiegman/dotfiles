[settings]
github_attestations = false
disable_hints = ["*"]
minimum_release_age_excludes = ["npm:*"]

[settings.node]
gpg_verify = false

# Use real npm rather than mise's built-in installer so that postinstall
# scripts run and platform-native optional dependencies are downloaded.
[settings.npm]
shell_out = true

[tools]
go = "latest"
node = "latest"
npm = "latest"
bun = "latest"
"npm:geekbot-cli" = "latest"
